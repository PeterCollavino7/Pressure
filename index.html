let _modal = null, _lastFocus = null;
function closeModal(v) {

}
/* opts: {title, html, actions:[{label, value, kind}], dismissible, onOpen(el)} → Promise<value|null> */
function openModal(opts) {
  if (_modal) closeModal(null);
  return new Promise(resolve => {
    _lastFocus = document.activeElement;
    const back = document.createElement('div');
    back.className = 'modal-back';
    const acts = (opts.actions || [{ label: 'Chiudi', value: true, kind: 'pri' }]).map((a, i) =>
      '<button type="button" class="btn ' + (a.kind || 'sec') + '" data-mv="' + i + '">' + esc(a.label) + '<\/button>').join('');
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t" tabindex="-1">' +
      '<h2 id="m-t">' + esc(opts.title || '') + '<\/h2><div class="m-body">' + (opts.html || '') + '<\/div>' +
      '<div class="m-acts">' + acts + '<\/div><\/div>';
    document.body.appendChild(back);
    document.body.classList.add('modal-open');
    const el = back.firstChild;
    const key = e => {
      if (e.key === 'Escape' && opts.dismissible !== false) { e.stopPropagation(); closeModal(null); }
      else if (e.key === 'Tab') {
        const f = $$('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])', el).filter(x => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', key, true);
    _modal = { back, resolve, key };
    back.addEventListener('click', e => {
      if (e.target === back && opts.dismissible !== false) { closeModal(null); return; }
      const b = e.target.closest('[data-mv]');
      if (!b) return;
      const a = (opts.actions || [{ value: true }])[+b.getAttribute('data-mv')];
      if (a.onClick && a.onClick(el) === false) return;
      closeModal(a.value);

    const first = $('[data-autofocus]', el) || $('.btn.pri,.btn.dng', el) || el;
    try { first.focus({ preventScroll: true }); } catch (e) { /* niente */ }
  });
}

/* --- 10-store.js --- */
/* ===== 10 · archivio dati (solo sul dispositivo) =====
   Ordine di preferenza: IndexedDB → localStorage → solo memoria (con avviso visibile).
   Nessuna richiesta di rete, nessun tracciamento. */
const DB_NAME = 'pressione-db', DB_VER = 1, LS_ITEMS = 'pressione.items.v1', LS_SET = 'pressione.settings.v1';

const DEFAULTS = {
  v: 1,
  th: { sysEl: 120, diaEl: 70, sysHt: 135, diaHt: 85, alertSys: 180, alertDia: 110 },
  bands: [5, 12, 18],                       /* inizio di mattina, pomeriggio, sera (ore) */
  tags: ['A riposo', 'Dopo il caffè', 'Dopo sport', 'Stress', 'Prima del farmaco', 'Dopo il farmaco'],
  protoStart: null,                         /* 'AAAA-MM-GG' oppure null = ultimi 7 giorni */
  theme: 'auto',
  period: '30', customFrom: null, customTo: null,
  name: '', reportDays: 30,
  firstUseTs: 0, lastBackupTs: 0, backupBase: 0, backupSnooze: 0,
  introDone: false

function idbOpen() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('IndexedDB bloccato'));
  });
}
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function idbTx(db, stores, mode, fn) {
  return new Promise((res, rej) => {
    const tx = db.transaction(stores, mode);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('transazione annullata'));
    try { fn(tx); } catch (e) { try { tx.abort(); } catch (x) { /* niente */ } rej(e); }
  });
}
const validItem = it => it && typeof it.id === 'string' && isNum(it.ts) && isNum(it.sys) && isNum(it.dia);
const byTs = (a, b) => a.ts - b.ts || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

function lowerBound(arr, ts) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].ts < ts) lo = m + 1; else hi = m; } return lo; }

const Store = {
  mode: 'mem', items: [], S: clone(DEFAULTS), persisted: null, err: null, writeFail: false, onFail: null,
  _db: null, _q: Promise.resolve(),

  async init() {
    let loaded = false;
    try {
      if (typeof indexedDB !== 'undefined' && indexedDB) {
        const db = await idbOpen();
        const rows = await idbReq(db.transaction('items', 'readonly').objectStore('items').getAll());
        const set = await idbReq(db.transaction('kv', 'readonly').objectStore('kv').get('settings'));
        db.onversionchange = () => { try { db.close(); } catch (e) { /* niente */ } };
        this._db = db; this.mode = 'idb'; this.items = rows || [];
        if (set) this._mergeSettings(set);

      }
    } catch (e) { this.err = e; this._db = null; }
    if (!loaded) {
      try {
        localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
        this.mode = 'ls';
        const a = localStorage.getItem(LS_ITEMS); this.items = a ? JSON.parse(a) : [];
        const s = localStorage.getItem(LS_SET); if (s) this._mergeSettings(JSON.parse(s));
        loaded = true;
      } catch (e) { this.err = e; this.mode = 'mem'; this.items = []; }
    }
    this.items = this.items.filter(validItem).sort(byTs);
    return this.mode;
  },
  _mergeSettings(s) {
    const d = clone(DEFAULTS);
    if (s && typeof s === 'object') {
      Object.keys(d).forEach(k => {
        if (s[k] == null) return;
        if (k === 'th' && typeof s.th === 'object') d.th = Object.assign(d.th, s.th);
        else d[k] = s[k];
      });
    }
    const b = d.bands;
    if (!Array.isArray(b) || b.length !== 3 || !(b[0] > 0 && b[0] < b[1] && b[1] < b[2] && b[2] < 24)) d.bands = DEFAULTS.bands.slice();
    if (!Array.isArray(d.tags)) d.tags = DEFAULTS.tags.slice();

  },
  /* ---- scrittura ---- */
  _fail(e) { this.writeFail = true; this.err = e; if (this.onFail) this.onFail(e); },

    catch (e) { this._fail(e); return false; }
  },
  _commit(puts, dels) {

  add(it) { insertSorted(this.items, it); this._noteUse(); return this._commit([it], []); },
  addMany(arr) {
    arr.forEach(it => this.items.push(it));

    return this._commit(arr, []);
  },
  update(it) { this.items = this.items.filter(x => x.id !== it.id); insertSorted(this.items, it); return this._commit([it], []); },
  remove(ids) {
    const set = new Set(ids), out = [];

  saveSettings() {

  async requestPersist() {

  },
  /* ---- lettura ---- */
  range(from, to) { return this.items.slice(lowerBound(this.items, from), lowerBound(this.items, to)); },
  real() { return this.items.filter(x => !x.demo); },
  demoCount() { let n = 0; for (const x of this.items) if (x.demo) n++; return n; },
  byId(id) { return this.items.find(x => x.id === id) || null; }
};

/* Normalizza un elemento letto da file o dal modulo. Ritorna {item} oppure {err}. */
function normItem(o) {
  if (!o || typeof o !== 'object') return { err: 'riga non valida' };
  let ts = o.ts;
  if (typeof ts === 'string') ts = /^\d+$/.test(ts) ? +ts : Date.parse(ts);
  if (!isNum(ts) || ts < 0 || ts > 4102444800000) return { err: 'data o ora non valide' };
  const num = v => (v === '' || v == null) ? null : (typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')));
  const sys = num(o.sys), dia = num(o.dia), pul = num(o.pul);
  if (!isNum(sys) || !isNum(dia)) return { err: 'pressione mancante o non numerica' };
  const S = Math.round(sys), D = Math.round(dia);
  if (S < 20 || S > 400 || D < 20 || D > 400) return { err: 'valori di pressione impossibili' };
  if (S <= D) return { err: 'la massima deve essere maggiore della minima' };
  let P = null;
  if (pul != null) { if (!isNum(pul)) return { err: 'polso non numerico' }; P = Math.round(pul); if (P < 10 || P > 300) return { err: 'polso impossibile' }; }
  let tags = o.tags;
  if (typeof tags === 'string') tags = tags.split(/[|,]/);
  tags = Array.isArray(tags) ? tags.map(t => String(t).replace(/[|;,]/g, ' ').trim()).filter(Boolean).slice(0, 12) : [];
  const arm = o.arm === 'sx' || o.arm === 'dx' ? o.arm : '';
  const pos = ['seduto', 'in piedi', 'sdraiato'].indexOf(o.pos) >= 0 ? o.pos : '';
  const it = { id: typeof o.id === 'string' && o.id ? o.id.slice(0, 40) : uid(), ts: Math.round(ts), sys: S, dia: D, pul: P, arm, pos, tags, note: String(o.note == null ? '' : o.note).slice(0, 500) };
  if (o.demo) it.demo = true;
  return { item: it };
}
const dupKey = it => it.ts + '|' + it.sys + '|' + it.dia;

/* ===== 20 · calcoli ===== */
/* Categoria (indicativa, mai una diagnosi): vince la più alta tra massima e minima. */
function catOf(sys, dia, th) {
  th = th || Store.S.th;
  if (sys >= th.sysHt || dia >= th.diaHt) return 2;
  if (sys >= th.sysEl || dia >= th.diaEl) return 1;
  return 0;
}
const isAlert = (sys, dia) => { const t = Store.S.th; return sys >= t.alertSys || dia >= t.alertDia; };

const mean = a => { if (!a.length) return null; let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s / a.length; };
const median = a => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
/* deviazione standard campionaria (n − 1); con meno di 2 valori non è definita */
const sdev = a => { const n = a.length; if (n < 2) return null; const m = mean(a); let s = 0; for (let i = 0; i < n; i++) s += (a[i] - m) * (a[i] - m); return Math.sqrt(s / (n - 1)); };

function statOf(items, get) {
  const v = [], idx = [];
  for (const it of items) { const x = get(it); if (x != null) { v.push(x); idx.push(it); } }
  if (!v.length) return { n: 0, mean: null, median: null, min: null, max: null, minTs: null, maxTs: null, sd: null };
  let mi = 0, ma = 0;
  for (let i = 1; i < v.length; i++) { if (v[i] < v[mi]) mi = i; if (v[i] > v[ma]) ma = i; }
  return { n: v.length, mean: mean(v), median: median(v), min: v[mi], max: v[ma], minTs: idx[mi].ts, maxTs: idx[ma].ts, sd: sdev(v) };
}
function summarize(items) {
  return {
    n: items.length,
    sys: statOf(items, i => i.sys), dia: statOf(items, i => i.dia),
    pul: statOf(items, i => i.pul), pp: statOf(items, i => i.sys - i.dia)
  };
}

/* Raggruppa per giorno di calendario locale. `items` dev'essere ordinato per data. */
function daily(items) {
  const out = []; let cur = null;
  for (const it of items) {
    const dn = dayNum(it.ts);
    if (!cur || cur.dn !== dn) {
      cur = { dn, n: 0, sysS: 0, diaS: 0, pulS: 0, pulN: 0, sysMin: 1e9, sysMax: -1e9, diaMin: 1e9, diaMax: -1e9, pulMin: 1e9, pulMax: -1e9, items: [] };
      out.push(cur);
    }
    cur.n++; cur.sysS += it.sys; cur.diaS += it.dia;
    if (it.sys < cur.sysMin) cur.sysMin = it.sys; if (it.sys > cur.sysMax) cur.sysMax = it.sys;
    if (it.dia < cur.diaMin) cur.diaMin = it.dia; if (it.dia > cur.diaMax) cur.diaMax = it.dia;
    if (it.pul != null) { cur.pulS += it.pul; cur.pulN++; if (it.pul < cur.pulMin) cur.pulMin = it.pul; if (it.pul > cur.pulMax) cur.pulMax = it.pul; }
    cur.items.push(it);
  }
  for (const b of out) { b.sys = b.sysS / b.n; b.dia = b.diaS / b.n; b.pul = b.pulN ? b.pulS / b.pulN : null; }
  return out;
}
/* Media mobile su W giorni di calendario, calcolata su tutte le misure della finestra. */
function movAvg(days, W) {
  const out = []; let l = 0, sS = 0, dS = 0, n = 0;
  for (let i = 0; i < days.length; i++) {
    const d = days[i];
    sS += d.sysS; dS += d.diaS; n += d.n;
    while (days[l].dn < d.dn - (W - 1)) { sS -= days[l].sysS; dS -= days[l].diaS; n -= days[l].n; l++; }
    out.push({ dn: d.dn, sys: sS / n, dia: dS / n, n });
  }
  return out;
}

/* Media del protocollo domiciliare: ciclo di 7 giorni, primo giorno escluso. */
function protocolStats() {
  const S = Store.S, tn = todayNum();
  const custom = keyToDn(S.protoStart);
  const start = custom != null ? custom : tn - 6;
  const end = start + 6;
  const sel = Store.range(dayStart(start + 1), dayStart(end + 1));
  const sys = sel.map(i => i.sys), dia = sel.map(i => i.dia);
  const ms = mean(sys), md = mean(dia);
  const rs = ms == null ? null : Math.round(ms), rd = md == null ? null : Math.round(md);
  const days = new Set(sel.map(i => dayNum(i.ts))).size;
  return { start, end, custom: custom != null, n: sel.length, days, sys: rs, dia: rd, cat: rs == null ? null : catOf(rs, rd), reliable: sel.length >= 10 };
}

/* Fasce orarie: [notte 00–b0) [mattina b0–b1) [pomeriggio b1–b2) [sera b2–24) */
const BAND_NAMES = ['Notte', 'Mattina', 'Pomeriggio', 'Sera'];
function bandIdx(ts, b) { const d = new Date(ts), h = d.getHours() + d.getMinutes() / 60; return h < b[0] ? 0 : h < b[1] ? 1 : h < b[2] ? 2 : 3; }

function byBand(items, b) {
  const g = [[], [], [], []];
  for (const it of items) g[bandIdx(it.ts, b)].push(it);
  return g.map(list => ({ list, n: list.length, sys: statOf(list, i => i.sys), dia: statOf(list, i => i.dia), pul: statOf(list, i => i.pul) }));
}
function catCounts(items) {
  const c = [0, 0, 0];
  for (const it of items) c[catOf(it.sys, it.dia)]++;
  return c;
}

/* ===== 30 · grafici (SVG scritti a mano, nessuna libreria) ===== */
const Charts = {}, Tables = {};

/* ---------- strumenti comuni ---------- */
function yScale(lo, hi, h) {
  if (!(hi > lo)) hi = lo + 10;
  const target = Math.max(3, Math.floor(h / 28));
  const steps = [1, 2, 5, 10, 20, 50, 100];
  let step = 100;
  for (let k = 0; k < steps.length; k++) { const s = steps[k]; if (Math.ceil(hi / s) - Math.floor(lo / s) <= target) { step = s; break; } }
  const min = Math.floor(lo / step) * step; let max = Math.ceil(hi / step) * step;
  if (max === min) max += step;
  const ticks = []; for (let v = min; v <= max + 1e-9; v += step) ticks.push(v);
  return { min, max, step, ticks };
}
function timeTicks(t0, t1, pw) {
  const span = (t1 - t0) / DAY, out = [], d0 = dayNum(t0), d1 = dayNum(t1 - 1);

    for (let dn = d0; dn <= d1; dn++) { const p = dnParts(dn); for (let h = 0; h < 24; h += step) { const ts = new Date(p.y, p.m, p.d, h).getTime(); if (ts >= t0 && ts <= t1) out.push({ ts, label: pad2(h) + ':00' }); } }
  } else if (span <= 16) {
    for (let dn = d0; dn <= d1; dn++) { const p = dnParts(dn); out.push({ ts: dayStart(dn) + 12 * HOUR, label: GIORNI3[p.w] + ' ' + p.d }); }
  } else if (span <= 75) {
    for (let dn = d0; dn <= d1; dn++) { const p = dnParts(dn); if (p.w === 1) out.push({ ts: dayStart(dn), label: p.d + ' ' + MESI3[p.m] }); }
  } else if (span <= 430) {
    for (let k = monthStartDn(d0); k <= d1; k = nextMonthStartDn(k)) { if (k < d0) continue; const p = dnParts(k); out.push({ ts: dayStart(k), label: MESI3[p.m] + (p.m === 0 ? ' ' + p.y : '') }); }
  } else if (span <= 1700) {
    for (let k = monthStartDn(d0); k <= d1; k = nextMonthStartDn(k)) { const p = dnParts(k); if (k >= d0 && p.m % 3 === 0) out.push({ ts: dayStart(k), label: MESI3[p.m] + ' ' + p.y }); }
  } else {

/* ---------- tooltip e interazione ---------- */
function ensureTip(host) {
  let t = host.querySelector('.tip');
  if (!t) { t = document.createElement('div'); t.className = 'tip'; t.setAttribute('role', 'status'); t.hidden = true; host.appendChild(t); }
  return t;
}
function showTip(host, html, ax) {
  const t = ensureTip(host);
  t.innerHTML = html; t.hidden = false;
  const hw = host.clientWidth, tw = t.offsetWidth;
  let left = ax + 14;
  if (left + tw > hw - 2) left = ax - 14 - tw;
  if (left < 2) left = Math.max(2, Math.min(hw - tw - 2, ax - tw / 2));
  t.style.left = Math.round(left) + 'px'; t.style.top = '6px';
}
function hideTip(host) {
  const t = host.querySelector('.tip'); if (t) t.hidden = true;
  if (host._geo && host._geo.clear) host._geo.clear();
}
function bindChart(host) {
  if (host._bound) return;
  host._bound = true;
  const pick = e => {
    const g = host._geo; if (!g || !g.n) return;
    const r = host.getBoundingClientRect();
    const i = g.pick(e.clientX - r.left, e.clientY - r.top, e.pointerType);
    if (i < 0) { hideTip(host); return; }
    g.cur = i; g.show(i);
  };
  host.addEventListener('pointerdown', e => { host._down = true; pick(e); });
  host.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || host._down) pick(e); });
  host.addEventListener('pointerup', () => { host._down = false; });
  host.addEventListener('pointercancel', () => { host._down = false; });
  host.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(host); });
  host.addEventListener('keydown', e => {
    const g = host._geo; if (!g || !g.n) return;
    let i = g.cur == null ? g.n - 1 : g.cur, ok = true;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') i = Math.max(0, i - 1);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') i = Math.min(g.n - 1, i + 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = g.n - 1;
    else if (e.key === 'Escape') { hideTip(host); return; }
    else ok = false;
    if (ok) { e.preventDefault(); g.cur = i; g.show(i); }
  });
  host.addEventListener('focus', () => { const g = host._geo; if (g && g.n && g.cur == null) { g.cur = g.n - 1; g.show(g.cur); } });
  host.addEventListener('blur', () => hideTip(host));
}
document.addEventListener('pointerdown', e => { if (!e.target.closest || !e.target.closest('.chart')) $$('.chart').forEach(hideTip); }, true);

/* ---------- 1 · andamento ---------- */
Charts.trend = function (host, c) {

  const m = { l: 34, r: W < 360 ? 50 : 58, t: 22, b: 26 };
  const hA = showPul ? 186 : 230, gap = showPul ? 32 : 0, hB = showPul ? 76 : 0;
  const x0 = m.l, x1 = W - m.r, pw = x1 - x0, t0 = c.t0, t1 = c.t1;
  const yBot = m.t + hA + gap + hB, H = yBot + m.b;

  const ys = yScale(Math.min(lo, th.diaHt) - 5, Math.max(hi, th.sysHt) + 5, hA);

  const noon = dn => dayStart(dn) + 12 * HOUR;
  let s = gridY(ys, YA, x0, x1) + '<text class="ax" x="2" y="10">mmHg<\/text>' + refLines(YA, x0, x1, true);
  /* polso (pannello allineato sotto, stesso asse del tempo: mai un doppio asse y) */
  let ps = null, YB = () => 0;
  if (showPul) {
    let pl = 1e9, ph = -1e9;
    items.forEach(i => { if (i.pul != null) { if (i.pul < pl) pl = i.pul; if (i.pul > ph) ph = i.pul; } });
    ps = yScale(pl - 3, ph + 3, hB);

  /* prima i punti singoli (tenui se sono tanti), sopra le linee: media del giorno e media mobile */

  let pS = '', pD = '';
  for (const it of items) { const x = X(it.ts); pS += triD(x, YA(it.sys), r); pD += triU(x, YA(it.dia), r); }
  s += '<path class="mk f-dia' + (dense ? ' dn' : '') + '" d="' + pD + '"/><path class="mk f-sys' + (dense ? ' dn' : '') + '" d="' + pS + '"/>';
  s += '<path class="ln l-dia" d="' + linePath(pt(days, 'dia', YA), 3) + '"/><path class="ln l-sys" d="' + linePath(pt(days, 'sys', YA), 3) + '"/>';
  s += '<path class="ln l-dia ma" d="' + linePath(pt(ma, 'dia', YA), 3) + '"/><path class="ln l-sys ma" d="' + linePath(pt(ma, 'sys', YA), 3) + '"/>';
  s += refLabels(YA, x0);
  const ld = days[days.length - 1], lx = Math.min(X(noon(ld.dn)) + 9, W - 46);
  s += '<text class="ax lab halo" x="' + f1(lx) + '" y="' + f1(YA(ld.sys) + 4) + '">Massima<\/text><text class="ax lab halo" x="' + f1(lx) + '" y="' + f1(YA(ld.dia) + 4) + '">Minima<\/text>';
  if (showPul) {
    const pd = days.filter(d => d.pul != null);
    s += '<path class="ln l-pul" d="' + linePath(pd.map(d => ({ dn: d.dn, x: X(noon(d.dn)), y: YB(d.pul) })), 3) + '"/>';
    let pp = ''; items.forEach(i => { if (i.pul != null) pp += circP(X(i.ts), YB(i.pul), dense ? 2.6 : 3.6); });
    s += '<path class="mk f-pul' + (dense ? ' dn' : '') + '" d="' + pp + '"/>';

  ensureTip(host);
  const hg = host.querySelector('.hlg'), xh = hg.children[0], cs = hg.children[1], cd = hg.children[2], cp = hg.children[3];
  host._geo = {

    pick(px) { return (px < x0 - 12 || px > x1 + 14) ? -1 : nearestIdx(items, t0 + (px - x0) / pw * (t1 - t0), 'ts'); },
    show(i) {
      const it = items[i], x = X(it.ts);

      cs.setAttribute('cx', x); cs.setAttribute('cy', YA(it.sys));
      cd.setAttribute('cx', x); cd.setAttribute('cy', YA(it.dia));
      if (showPul && it.pul != null) { cp.setAttribute('cx', x); cp.setAttribute('cy', YB(it.pul)); cp.setAttribute('visibility', 'visible'); } else cp.setAttribute('visibility', 'hidden');
      hg.setAttribute('visibility', 'visible');

/* ---------- 2 · medie giornaliere e intervallo min–max ---------- */
function rangeBuckets(items, d0, d1) {
  const span = d1 - d0 + 1, kind = span <= 100 ? 'd' : span <= 450 ? 'w' : 'm';
  const keyOf = dn => kind === 'd' ? dn : kind === 'w' ? mondayOf(dn) : monthStartDn(dn);
  const next = k => kind === 'd' ? k + 1 : kind === 'w' ? k + 7 : nextMonthStartDn(k);
  const list = [], map = new Map();
  for (let k = keyOf(d0); k <= d1; k = next(k)) { const b = { k, n: 0, sS: 0, dS: 0, sMin: 1e9, sMax: -1e9, dMin: 1e9, dMax: -1e9 }; list.push(b); map.set(k, b); }
  for (const it of items) {
    const b = map.get(keyOf(dayNum(it.ts)));
    if (!b) continue;
    b.n++; b.sS += it.sys; b.dS += it.dia;
    if (it.sys < b.sMin) b.sMin = it.sys; if (it.sys > b.sMax) b.sMax = it.sys;
    if (it.dia < b.dMin) b.dMin = it.dia; if (it.dia > b.dMax) b.dMax = it.dia;
  }
  list.forEach(b => { if (b.n) { b.sM = b.sS / b.n; b.dM = b.dS / b.n; } });
  return { kind, list };
}
const bucketLabel = (kind, k) => kind === 'd' ? fmtDnShort(k) + ' ' + dnParts(k).y : kind === 'w' ? 'settimana dal ' + fmtDnNum(k) : cap1(MESI[dnParts(k).m]) + ' ' + dnParts(k).y;
Charts.range = function (host, c) {
  const items = c.items;
  if (!items.length) return emptyChart(host);
  const W = Math.max(300, host.clientWidth || 340), m = { l: 34, r: 10, t: 22, b: 26 }, hP = 216, H = m.t + hP + m.b;
  const x0 = m.l, x1 = W - m.r, pw = x1 - x0, th = Store.S.th;
  const rb = rangeBuckets(items, c.d0, c.d1), N = rb.list.length, step = pw / N;
  const seq = []; rb.list.forEach((b, i) => { if (b.n) seq.push(i); });
  let lo = 1e9, hi = -1e9;
  seq.forEach(i => { const b = rb.list[i]; if (b.dMin < lo) lo = b.dMin; if (b.sMax > hi) hi = b.sMax; });
  const ys = yScale(Math.min(lo, th.diaHt) - 5, Math.max(hi, th.sysHt) + 5, hP);
  const Y = v => m.t + (1 - (v - ys.min) / (ys.max - ys.min)) * hP;
  const xc = i => x0 + (i + .5) * step;
  const bw = clamp(step * .62, 3, 18);
  let s = gridY(ys, Y, x0, x1) + '<text class="ax" x="2" y="10">mmHg<\/text>' + refLines(Y, x0, x1, true);
  const t0 = c.t0, t1 = c.t1, X = ts => x0 + (ts - t0) / (t1 - t0) * pw;
  if (rb.kind === 'd') s += xAxisTime(t0, t1, x0, pw, m.t + hP, X);
  else {
    let last = -1e9;
    rb.list.forEach((b, i) => { const x = xc(i); if (x - last < 46) return; last = x; const p = dnParts(b.k); s += '<line class="axis" x1="' + f1(x) + '" x2="' + f1(x) + '" y1="' + (m.t + hP) + '" y2="' + (m.t + hP + 4) + '"/><text class="ax" x="' + f1(x) + '" y="' + (m.t + hP + 17) + '" text-anchor="middle">' + (rb.kind === 'w' ? p.d + ' ' + MESI3[p.m] : MESI3[p.m] + (p.m === 0 ? ' ' + p.y : '')) + '<\/text>'; });
  }
  s += '<rect class="colhl" visibility="hidden" y="' + m.t + '" height="' + hP + '" width="' + f1(Math.max(step, 6)) + '"/>';
  let capS = '', capD = '', mS = '', mD = '';
  const rr = Math.min(bw / 2, 4), mr = Math.max(3.4, Math.min(5, bw / 2 + 1));
  seq.forEach(i => {
    const b = rb.list[i], x = xc(i);
    const yS1 = Y(b.sMax), yS2 = Math.max(Y(b.sMin), yS1 + 3), yD1 = Y(b.dMax), yD2 = Math.max(Y(b.dMin), yD1 + 3);
    capS += '<rect x="' + f1(x - bw / 2) + '" y="' + f1(yS1) + '" width="' + f1(bw) + '" height="' + f1(yS2 - yS1) + '" rx="' + rr + '"/>';
    capD += '<rect x="' + f1(x - bw / 2) + '" y="' + f1(yD1) + '" width="' + f1(bw) + '" height="' + f1(yD2 - yD1) + '" rx="' + rr + '"/>';

  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Intervallo giornaliero minimo–massimo e media">' + s + '<\/svg>';
  ensureTip(host);
  const hl = host.querySelector('.colhl');
  host._geo = {
    n: seq.length, cur: null,
    pick(px) {
      if (px < x0 - 6 || px > x1 + 6) return -1;
      const col = clamp(Math.floor((px - x0) / step), 0, N - 1);
      let lo2 = 0, hi2 = seq.length - 1;

      return lo2;
    },
    show(j) {
      const i = seq[j], b = rb.list[i], x = xc(i);
      hl.setAttribute('x', f1(x - Math.max(step, 6) / 2)); hl.setAttribute('visibility', 'visible');
      const lv = catOf(Math.round(b.sM), Math.round(b.dM));
      showTip(host, '<div class="tip-h">' + esc(bucketLabel(rb.kind, b.k)) + '<\/div>' +
        trow('sys', Math.round(b.sM), 'Massima · media (' + b.sMin + '–' + b.sMax + ')') + trow('dia', Math.round(b.dM), 'Minima · media (' + b.dMin + '–' + b.dMax + ')') +
        '<div class="tip-c">' + catChip(lv) + '<\/div><div class="tip-m">' + nMis(b.n) + '<\/div>', x);
    },
    clear() { hl.setAttribute('visibility', 'hidden'); this.cur = null; }
  };
  bindChart(host);
};
Tables.range = function (c) {

  const rows = rb.list.filter(b => b.n).map(b => [esc(bucketLabel(rb.kind, b.k)), b.n, Math.round(b.sM) + ' <small>(' + b.sMin + '–' + b.sMax + ')<\/small>', Math.round(b.dM) + ' <small>(' + b.dMin + '–' + b.dMax + ')<\/small>']);

/* ---------- 3 · per fascia oraria ---------- */
Charts.band = function (host, c) {

/* ---------- consegna di un file (in app: download o condivisione; in anteprima: capability "downloads") ---------- */
function copyDialog(name, text) {
  return openModal({
    title: 'Copia il contenuto',
    html: '<p>Il salvataggio diretto non è disponibile qui. Copia il testo e incollalo in un file chiamato <b>' + esc(name) + '<\/b>.<\/p><textarea class="inp code" readonly rows="8" data-autofocus>' + esc(text.length > 400000 ? text.slice(0, 400000) : text) + '<\/textarea>',
    actions: [{ label: 'Chiudi', value: 'close', kind: 'sec' }, {
      label: 'Copia', value: 'copy', kind: 'pri',
      onClick: el => {
        const ta = $('textarea', el); ta.focus(); ta.select();
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text); else document.execCommand('copy'); toast('Copiato'); } catch (e) { toast('Seleziona il testo e copialo a mano'); }
        return false;
      }
    }]
  }).then(() => 'copied');
}
async function deliverFile(name, text, mime, o) {
  o = o || {};
  if (IS_ARTIFACT) {
    try {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data: text }); return 'saved'; }
    } catch (e) { if (e && e.code === 'declined') return 'declined'; }
    return copyDialog(name, text);
  }
  let blob;
  try { blob = new Blob([text], { type: mime + ';charset=utf-8' }); } catch (e) { return copyDialog(name, text); }
  if (o.share && navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], name, { type: mime });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 6000);
    return 'saved';
  } catch (e) { return copyDialog(name, text); }
}
const stamp = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };

function jsonBackup() {

  return '{"app":"pressione","formato":1,"esportato":' + JSON.stringify(new Date().toISOString()) + ',"impostazioni":' + JSON.stringify(S) + ',"misure":[\n' + items.map(i => JSON.stringify(i)).join(',\n') + '\n]}\n';
}
const csvQ = v => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function csvExport(items) {
  const head = ['data', 'ora', 'massima', 'minima', 'polso', 'braccio', 'posizione', 'tag', 'nota'];
  const rows = items.map(i => [fmtDate(i.ts), fmtTime(i.ts), i.sys, i.dia, i.pul == null ? '' : i.pul, i.arm === 'sx' ? 'sinistro' : i.arm === 'dx' ? 'destro' : '', i.pos, (i.tags || []).join('|'), i.note].map(csvQ).join(';'));
  return '﻿' + head.join(';') + '\r\n' + rows.join('\r\n') + (rows.length ? '\r\n' : '');
}
async function exportFlow(kind, share) {
  const real = Store.real();

  const isJ = kind === 'json';
  const r = await deliverFile(isJ ? 'pressione-backup-' + stamp() + '.json' : 'pressione-misure-' + stamp() + '.csv', isJ ? jsonBackup() : csvExport(real), isJ ? 'application/json' : 'text/csv', { share });

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeDemo(days) {
  days = days || 60;
  const rnd = mulberry32(20260123), out = [], tn = todayNum();
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  let drift = 0;
  for (let k = days - 1; k >= 0; k--) {
    if (k > 0 && rnd() < 0.12) continue;                        /* qualche giorno senza misure */
    const dn = tn - k, p = dnParts(dn);
    drift = drift * 0.8 + gauss() * 2.2;
    const trend = -5 * (days - 1 - k) / (days - 1);             /* lieve miglioramento nel tempo */
    const slots = [[7, 8.9], [20, 21.9]];
    if (rnd() < 0.25) slots.push([13, 14.6]);
    if (rnd() < 0.04) slots.push([2.6, 4.2]);
    for (const sl of slots) {
      const reps = (sl[0] < 9 || sl[0] >= 20) && rnd() < 0.7 ? 2 : 1;
      const hr = sl[0] + rnd() * (sl[1] - sl[0]);
      for (let r = 0; r < reps; r++) {
        const h = Math.floor(hr), mi = Math.min(59, Math.floor((hr - h) * 60) + r * (1 + Math.floor(rnd() * 2)));
        const ts = new Date(p.y, p.m, p.d, h, mi).getTime();
        if (ts > Date.now()) continue;
        const tags = []; let bump = 0;
        const x = rnd();
        if (x < 0.10) { tags.push('Dopo il caffè'); bump = 6; } else if (x < 0.18) { tags.push('Stress'); bump = 8; } else if (x < 0.32) tags.push('A riposo');
        const morning = h < 12 && h >= 5 ? 6 : h >= 12 && h < 18 ? 2 : 0;
        let sys = Math.round(130 + trend + drift + morning + bump + gauss() * 4.5 - (h < 5 ? 8 : 0));
        sys = clamp(sys, 104, 168);
        let dia = Math.round(80 + (sys - 130) * 0.45 + (morning ? 2 : 0) + gauss() * 2.6);
        dia = clamp(dia, 58, Math.min(102, sys - 24));
        const pul = clamp(Math.round(70 + gauss() * 5 + (h < 5 ? -8 : 0) + (bump ? 3 : 0)), 52, 98);
        out.push({ id: uid(), ts, sys, dia, pul, arm: rnd() < 0.9 ? 'sx' : 'dx', pos: 'seduto', tags, note: tags.length === 0 && rnd() < 0.04 ? 'Dopo una camminata veloce' : '', demo: true });
      }
    }
  }
  return out;
}

function fillHistory() {
  const box = $('#hist-list'); if (!box) return;
  let list = Store.items.slice().reverse();
  const q = noAcc(UI.histQ);
  if (UI.histCat >= 0) list = list.filter(i => catOf(i.sys, i.dia) === UI.histCat);
  if (q) list = list.filter(i => noAcc((i.tags || []).join(' ') + ' ' + i.note + ' ' + i.sys + '/' + i.dia).indexOf(q) >= 0);
  if (!list.length) { box.innerHTML = '<p class="empty">Nessuna misura corrisponde ai filtri.<\/p>'; return; }
  const shown = list.slice(0, UI.histLimit);
  let h = '', cur = null;
  for (const it of shown) {
    const dn = dayNum(it.ts);
    if (dn !== cur) {
      cur = dn;
      const all = Store.range(dayStart(dn), dayStart(dn + 1));
      const ms = Math.round(mean(all.map(i => i.sys))), md = Math.round(mean(all.map(i => i.dia)));
      h += (h ? '<\/div>' : '') + '<h3 class="day-h"><span>' + esc(cap1(fmtDnLong(dn))) + '<\/span><small>' + nMis(all.length) + ' · media ' + ms + '/' + md + '<\/small><\/h3><div class="rows">';
    }
    h += rowHTML(it);
  }
  h += '<\/div>';
  if (list.length > shown.length) h += '<button type="button" class="btn sec block" data-act="hist-more">Mostra altre ' + Math.min(60, list.length - shown.length) + ' (' + (list.length - shown.length) + ' restanti)<\/button>';
  box.innerHTML = h;
}

/* ===== 55 · navigazione, azioni e modulo di inserimento ===== */
const ROUTES = ['oggi', 'storico', 'grafici', 'impostazioni', 'nuova', 'modifica'];
const isFormRoute = r => r === 'nuova' || r === 'modifica';
const hashFor = (n, a) => '#/' + n + (a ? '/' + encodeURIComponent(a) : '');
function parseHash() {
  const m = /^#\/([a-z]+)(?:\/(.+))?$/.exec(location.hash || '');
  return m && ROUTES.indexOf(m[1]) >= 0 ? { name: m[1], arg: m[2] ? decodeURIComponent(m[2]) : null } : { name: 'oggi', arg: null };
}
function nav(name, arg) {
  const h = hashFor(name, arg);
  if (location.hash === h) { setRoute(name, arg); return; }
  try { location.hash = h; } catch (e) { setRoute(name, arg); return; }
  setTimeout(() => { if (UI.route !== name || (UI.arg || null) !== (arg || null)) setRoute(name, arg); }, 80);   /* se "hashchange" non scatta (ambienti incorporati) */
}
function setRoute(name, arg) {
  arg = arg || null;
  if (name === 'modifica' && !Store.byId(arg)) { name = 'storico'; arg = null; }
  const changed = UI.route !== name || UI.arg !== arg;
  if (isFormRoute(name) && (changed || !UI.form)) initForm(name === 'modifica' ? arg : null);
  UI.route = name; UI.arg = arg;
  render();
  if (changed) { window.scrollTo(0, 0); const t = $('#page-title'); if (t) try { t.focus({ preventScroll: true }); } catch (e) { /* niente */ } }
}
function render() {
  const r = UI.route, el = $('#main');
  document.body.setAttribute('data-view', r);
  $('#tabbar').hidden = isFormRoute(r);
  el.innerHTML = r === 'oggi' ? viewOggi() : r === 'storico' ? viewStorico() : r === 'grafici' ? viewGrafici() : r === 'impostazioni' ? viewImpostazioni() : viewForm();
  $$('.tab', $('#tabbar')).forEach(b => { if (b.dataset.to === r) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (r === 'storico') fillHistory();
  if (r === 'grafici') { drawCharts(); watchResize(); }
  if (isFormRoute(r)) {
    updateLive();
    if (!UI.form.id) setTimeout(() => { const s = $('#f-ins [name=sys]'); if (s && !s.value && UI.route === r) try { s.focus(); } catch (e) { /* niente */ } }, 40);
  }
}
function refresh() { if (isFormRoute(UI.route)) return; const y = window.scrollY; render(); window.scrollTo(0, y); }
window.UI_refresh = refresh;
function watchResize() {
  const root = $('#charts-page'); if (!root) return;
  if (window.ResizeObserver) {
    if (!UI.ro) UI.ro = new ResizeObserver(() => { clearTimeout(UI._rt); UI._rt = setTimeout(() => { const r2 = $('#charts-page'); if (r2 && Math.abs(r2.clientWidth - UI.lastW) > 1) drawCharts(); }, 100); });
    UI.ro.disconnect(); UI.ro.observe(root);
  }
}
window.addEventListener('resize', debounce(() => { const r2 = $('#charts-page'); if (r2 && !window.ResizeObserver && Math.abs(r2.clientWidth - UI.lastW) > 1) drawCharts(); }, 150));

/* ---------- tema ---------- */
function applyTheme() {
  const t = Store.S.theme, root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  $$('meta[name=theme-color]').forEach(m => { m.setAttribute('content', t === 'auto' ? m.getAttribute('data-c') : (t === 'dark' ? '#0d0d0d' : '#f3f3f0')); });
}

/* ---------- modulo: lettura, controllo, salvataggio ---------- */
function captureForm() {
  const f = $('#f-ins'); if (!f || !UI.form) return;
  const F = UI.form, e = f.elements;
  F.sys = e.sys.value; F.dia = e.dia.value; F.pul = e.pul.value; F.note = e.note.value;
  const a = $('input[name=arm]:checked', f), p = $('input[name=pos]:checked', f);
  F.arm = a ? a.value : ''; F.pos = p ? p.value : '';
  F.tags = $$('input[name=tag]:checked', f).map(x => x.value);
  F.dateStr = e.date.value; F.timeStr = e.time.value;
}
const intOf = s => /^\d{1,4}$/.test(String(s).trim()) ? +String(s).trim() : NaN;
function readForm() {
  captureForm();
  const F = UI.form, errors = [], warns = [];
  const ts = inputsToTs(F.dateStr, F.timeStr);
  if (isNaN(ts)) errors.push({ f: 'date', m: 'Controlla data e ora.' });
  const sys = intOf(F.sys), dia = intOf(F.dia), pul = String(F.pul).trim() === '' ? null : intOf(F.pul);
  if (isNaN(sys)) errors.push({ f: 'sys', m: String(F.sys).trim() === '' ? 'Inserisci la massima (SYS).' : 'La massima deve essere un numero intero.' });
  if (isNaN(dia)) errors.push({ f: 'dia', m: String(F.dia).trim() === '' ? 'Inserisci la minima (DIA).' : 'La minima deve essere un numero intero.' });
  if (pul !== null && isNaN(pul)) errors.push({ f: 'pul', m: 'Il polso deve essere un numero intero (oppure lascia il campo vuoto).' });
  if (!isNaN(sys) && !isNaN(dia) && sys <= dia) errors.push({ f: 'sys', m: 'La massima deve essere maggiore della minima.' });
  if (!isNaN(sys) && (sys < 20 || sys > 400)) errors.push({ f: 'sys', m: 'La massima non è plausibile (tra 20 e 400).' });
  if (!isNaN(dia) && (dia < 20 || dia > 400)) errors.push({ f: 'dia', m: 'La minima non è plausibile (tra 20 e 400).' });
  if (pul !== null && !isNaN(pul) && (pul < 10 || pul > 300)) errors.push({ f: 'pul', m: 'Il polso non è plausibile (tra 10 e 300).' });
  if (!errors.length) {
    if (sys < 70 || sys > 250) warns.push('La massima di ' + sys + ' è insolita: controlla di non aver sbagliato cifra.');
    if (dia < 40 || dia > 150) warns.push('La minima di ' + dia + ' è insolita: controlla di non aver sbagliato cifra.');
    if (pul !== null && (pul < 30 || pul > 200)) warns.push('Il polso di ' + pul + ' è insolito: controlla di non aver sbagliato cifra.');
    if (ts > Date.now() + 5 * 60000) warns.push('La data e l’ora sono nel futuro.');
  }
  return { errors, warns, v: { ts, sys, dia, pul } };
}
function showFormErrors(errors) {
  $('#f-warn').textContent = '';
  $('#f-err').innerHTML = errors.map(e => esc(e.m)).join('<br>');
  $$('#f-ins [aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
  errors.forEach(e => { const i = $('#f-ins [name=' + e.f + ']'); if (i) i.setAttribute('aria-invalid', 'true'); });
  const first = $('#f-ins [name=' + errors[0].f + ']'); if (first) try { first.focus(); } catch (e) { /* niente */ }
}
function updateLive() {
  const f = $('#f-ins'); if (!f) return;
  const s = /^\d{2,3}$/.test(f.elements.sys.value) ? +f.elements.sys.value : NaN, d = /^\d{2,3}$/.test(f.elements.dia.value) ? +f.elements.dia.value : NaN;
  $('#live-cat').innerHTML = (!isNaN(s) && !isNaN(d) && s > d) ? catChip(catOf(s, d)) + '<span class="mut small">Indicativo, non è una diagnosi<\/span>' : '';
}
function alertDialog(it) {
  return openModal({
    title: 'Valore molto alto',
    html: '<p>Hai registrato <b>' + it.sys + '/' + it.dia + ' mmHg<\/b>. Sono valori alti, ma una sola misura non basta per trarre conclusioni: mantieni la calma.<\/p>' +
      '<ul class="bul"><li>Siediti e riposa 5 minuti, senza parlare, poi misura di nuovo.<\/li><li>Se resta così alta, contatta il medico o la guardia medica.<\/li>' +
      '<li><b>Se hai dolore al petto, fiato corto, mal di testa fortissimo, difficoltà a parlare o a vedere, debolezza o formicolio a un braccio o a una gamba, chiama subito il 112.<\/b><\/li><\/ul>' +
      '<a class="btn dng block" href="tel:112">' + ic('phone') + ' Chiama il 112<\/a>',

function saveForm(more) {
  const r = readForm();
  if (r.errors.length) { showFormErrors(r.errors); return; }
  const F = UI.form;
  if (r.warns.length && !F.ack) {
    F.ack = true;
    $('#f-err').textContent = '';
    $('#f-warn').innerHTML = r.warns.map(esc).join('<br>') + '<br><b>Se è corretto, tocca “Salva comunque”.<\/b>';
    $('#btn-save').textContent = 'Salva comunque';
    return;
  }
  const v = r.v; let ts = v.ts;
  if (F.id && F.orig && F.dateStr === F.orig.date && F.timeStr === F.orig.time) ts = F.ts;     /* data/ora invariate: non toccare il timestamp (ore ambigue del cambio ora legale) */
  const it = { id: F.id || uid(), ts, sys: v.sys, dia: v.dia, pul: v.pul, arm: F.arm, pos: F.pos, tags: F.tags.slice(), note: String(F.note).trim() };
  if (F.demo) it.demo = true;
  const prev = F.id ? Store.byId(F.id) : null;
  if (F.id) Store.update(it); else { Store.add(it); Store.requestPersist(); }
  toast((F.id ? 'Modifica salvata' : 'Misura salvata') + ': ' + it.sys + '/' + it.dia + ' · ' + CAT_LABEL[catOf(it.sys, it.dia)]);
  if (more && !F.id) {
    const keep = { arm: F.arm, pos: F.pos, tags: F.tags.slice() };
    initForm(null); Object.assign(UI.form, keep);
    render(); window.scrollTo(0, 0);
  } else nav(UI.from && !isFormRoute(UI.from) ? UI.from : 'oggi');
  if (isAlert(it.sys, it.dia) && (!prev || prev.sys !== it.sys || prev.dia !== it.dia)) alertDialog(it);   /* niente allarme se cambio solo una nota */
}

  'report-print'() { try { window.print(); } catch (e) { toast('Stampa non disponibile qui: usa “Scarica”'); } },
  'report-dl'() { deliverFile('pressione-report-' + stamp() + '.html', reportDocument(reportInner(Store.S.reportDays || 30)), 'text/html'); }
};

/* ---------- invio dei moduli ([data-form]) ---------- */
const FORMS = {
  ins() { saveForm(false); },
  th(f) {
    const g = n => { const v = f.elements[n].value.trim(); return /^\d{1,3}$/.test(v) ? +v : NaN; };
    const t = { sysEl: g('sysEl'), diaEl: g('diaEl'), sysHt: g('sysHt'), diaHt: g('diaHt'), alertSys: g('alertSys'), alertDia: g('alertDia') }, err = $('#th-err');
    if (Object.keys(t).some(k => isNaN(t[k]))) { err.textContent = 'Inserisci solo numeri interi.'; return; }
    if (!(t.sysEl < t.sysHt && t.sysHt < t.alertSys) || !(t.diaEl < t.diaHt && t.diaHt < t.alertDia)) { err.textContent = 'I valori devono crescere: non elevata, poi range ipertensivo, poi avviso (sia per la massima sia per la minima).'; return; }
    if (t.sysEl < 80 || t.alertSys > 260 || t.diaEl < 40 || t.alertDia > 160) { err.textContent = 'Valori fuori dall’intervallo ragionevole (massima 80–260, minima 40–160).'; return; }
    Store.S.th = t; Store.saveSettings(); toast('Soglie salvate'); refresh();
  },
  bands(f) {
    const g = n => { const v = f.elements[n].value.trim(); return /^\d{1,2}$/.test(v) ? +v : NaN; };
    const b = [g('b0'), g('b1'), g('b2')];
    if (b.some(isNaN) || !(b[0] > 0 && b[0] < b[1] && b[1] < b[2] && b[2] < 24)) { $('#bands-err').textContent = 'Servono tre ore crescenti tra 1 e 23 (per esempio 5, 12, 18).'; return; }
    Store.S.bands = b; Store.saveSettings(); toast('Fasce salvate'); refresh();
  },
  tag(f) {
    const v = f.elements.tag.value.replace(/[|;,\s]+/g, ' ').trim().slice(0, 30);
    if (!v) return;
    if (Store.S.tags.some(t => t.toLowerCase() === v.toLowerCase())) { toast('Questo tag esiste già'); return; }
    Store.S.tags.push(v); Store.saveSettings(); refresh();
  },
  proto(f) {
    const v = f.elements.start.value;
    if (v && keyToDn(v) == null) { toast('Data non valida'); return; }
    Store.S.protoStart = v || null; Store.saveSettings(); toast('Salvato'); refresh();
  },
  report(f) {
    Store.S.name = f.elements.name.value.trim().slice(0, 60); Store.S.reportDays = +f.elements.days.value || 30; Store.saveSettings();
    openReport();
  }
};

/* --- 60-main.js --- */
/* ===== 60 · avvio ===== */
function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    const f = ACT[el.dataset.act];
    if (f) { e.preventDefault(); f(el, e); }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest ? e.target.closest('form[data-form]') : null;
    if (!f) return;
    e.preventDefault();
    const h = FORMS[f.dataset.form];
    if (h) h(f);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (!t.matches) return;
    if (t.matches('#f-ins .num')) {
      const clean = t.value.replace(/\D+/g, '').slice(0, 3);
      if (clean !== t.value) t.value = clean;
      $('#f-err').textContent = ''; $('#f-warn').textContent = '';
      $$('#f-ins [aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
      if (UI.form.ack) { UI.form.ack = false; $('#btn-save').textContent = 'Salva'; }
      updateLive();
      if (clean.length === 3 && t.name === 'sys') $('#f-ins [name=dia]').focus();
      else if (clean.length === 3 && t.name === 'dia') $('#f-ins [name=pul]').focus();
    } else if (t.id === 'hist-q') { UI.histQ = t.value; UI.histLimit = 60; fillHistory(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'rg-from' || t.id === 'rg-to') {
      const a = $('#rg-from').value, b = $('#rg-to').value;
      if (keyToDn(a) != null && keyToDn(b) != null) { Store.S.customFrom = a; Store.S.customTo = b; Store.saveSettings(); drawCharts(); }
    } else if (t.id === 'file-in') { const f = t.files && t.files[0]; t.value = ''; handleImportFile(f); }
    else if (t.closest && t.closest('#f-ins') && UI.form && UI.form.ack) { UI.form.ack = false; $('#btn-save').textContent = 'Salva'; $('#f-warn').textContent = ''; }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const t = e.target;
    if (t.matches && t.matches('#f-ins [name=sys]')) { e.preventDefault(); $('#f-ins [name=dia]').focus(); }
    else if (t.matches && t.matches('#f-ins [name=dia]')) { e.preventDefault(); $('#f-ins [name=pul]').focus(); }
  });
  window.addEventListener('hashchange', () => { const r = parseHash(); if (r.name !== UI.route || (r.arg || null) !== UI.arg) setRoute(r.name, r.arg); });
  const dayCheck = () => { const d = todayNum(); if (UI.day && d !== UI.day) { UI.day = d; refresh(); } UI.day = d; };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });
  setInterval(dayCheck, 60000);
}

function tabbarHTML() {
  const t = (to, icon, label) => '<button type="button" class="tab" data-act="go" data-to="' + to + '">' + ic(icon) + '<span>' + label + '<\/span><\/button>';
  return '<div class="tabbar-in">' + t('oggi', 'home', 'Oggi') + t('storico', 'list', 'Storico') +
    '<div class="fab-wrap"><button type="button" class="fab" data-act="new" aria-label="Aggiungi una misura">' + ic('plus') + '<\/button><\/div>' +
    t('grafici', 'chart', 'Grafici') + t('impostazioni', 'sliders', 'Impostazioni') + '<\/div>';
}

async function boot() {
  await Store.init();
  Store.onFail = () => { toast('Salvataggio non riuscito: esporta un backup', { ms: 6000 }); if (!isFormRoute(UI.route)) refresh(); };
  applyTheme();
  $('#tabbar').innerHTML = tabbarHTML();
  UI.day = todayNum();
  bindGlobal();
  const r = parseHash();
  setRoute(r.name, r.arg);
  if (Store.items.length) Store.requestPersist();
  if (!IS_ARTIFACT && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    /* "load" può essere già scattato mentre si apriva il database: in quel caso si registra subito */
    const reg = () => { navigator.serviceWorker.register('./sw.js').catch(() => { /* senza SW l'app funziona comunque online */ }); };
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
  const splash = $('#boot'); if (splash) splash.remove();
}

boot().catch(err => {
  const m = $('#main');
  if (m) m.innerHTML = '<div class="page"><p class="banner bad">Errore di avvio: ' + esc(err && err.message || err) + '<\/p><\/div>';

});

})();
